name: SubFree domain request review

on:
  pull_request:
    branches: [main]
    paths:
      - "domain-requests/pending/*.json"
  push:
    branches: [main]
    paths:
      - "domain-requests/pending/*.json"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate request after pull request creation
        id: validate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          files="$(git diff --name-only "origin/$BASE_REF...HEAD" -- 'domain-requests/pending/*.json')"
          test -n "$files" || { echo "No pending request file found"; exit 1; }
          count="$(printf '%s\n' "$files" | grep -c . || true)"
          test "$count" -eq 1 || { echo "Exactly one pending request file is required"; exit 1; }
          file="$(printf '%s\n' "$files" | head -n 1)"
          node - "$file" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const name = file.split('/').pop().replace(/\.json$/, '');
          if (data.schemaVersion !== 2) throw new Error('Unsupported schemaVersion');
          if (typeof data.applicationId !== 'string' || !/^[0-9a-f-]{36}$/.test(data.applicationId)) throw new Error('Invalid application ID');
          if (name !== data.slug + '-' + data.applicationId) throw new Error('Slug or application ID does not match filename');
          if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(data.slug)) throw new Error('Invalid slug');
          if (typeof data.applicantName !== 'string' || !data.applicantName.trim()) throw new Error('Applicant name is missing');
          const url = new URL(data.websiteUrl);
          if (url.protocol !== 'https:' || url.username || url.password || url.port) throw new Error('Website URL must be public HTTPS on the default port');
          if (typeof data.purpose !== 'string' || data.purpose.trim().length < 30 || data.purpose.length > 1600) throw new Error('Purpose is missing or outside allowed length');
          for (const forbidden of ['applicantEmail','accessKey','requestIp','request_ip_hash','check_results','aiReview']) {
            if (Object.hasOwn(data, forbidden)) throw new Error('Private or internal field found in public PR: ' + forbidden);
          }
          console.log('Validated request summary: ' + file);
          NODE
          slug="$(node -e 'const d=require("./"+process.argv[1]);process.stdout.write(d.slug)' "$file")"
          if git cat-file -e "origin/$BASE_REF:domain-requests/$slug.json" 2>/dev/null; then
            echo "::error title=Domain path already occupied::The requested path /$slug/ is already registered. The PR was created and remains open, but cannot be merged."
            exit 1
          fi
          echo "Request file is valid and the public path is currently free."

      - name: Post validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          if [ "$VALIDATION_STATUS" = "success" ]; then
            result="**Ergebnis:** Formal gültig. Der gewünschte Pfad war zum Prüfzeitpunkt frei."
          else
            result="**Ergebnis:** Prüfung fehlgeschlagen. Die PR bleibt offen und wurde nicht automatisch geschlossen oder zusammengeführt. Details stehen im fehlgeschlagenen Check."
          fi
          body="$(printf '%s\\n\\n%s\\n\\n- Private Kontakt- und Zugangsdaten gehören nicht in die öffentliche PR-Datei.\\n- KI- und technische Prüfungen werden separat durchgeführt.\\n- Kein automatischer Merge.' "$result" "Dies ist keine Ablehnung der PR-Erstellung. Die PR wurde absichtlich vor dieser Prüfung angelegt.")"
          gh pr comment "$PR_NUMBER" --body "## SubFree: Prüfung nach PR-Erstellung

          $body"

  sync-approved-request:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize manually merged requests
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: https://eopvkwhcgznvubesaszv.supabase.co/functions/v1/subfree-api
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch origin main
          files="$(git diff --name-only "$BEFORE_SHA" "${GITHUB_SHA}" | grep '^domain-requests/pending/.*\.json$' || true)"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            slug="$(node -e 'const d=require("./"+process.argv[1]);process.stdout.write(d.slug)' "$file")"
            app_id="$(node -e 'const d=require("./"+process.argv[1]);process.stdout.write(d.applicationId)' "$file")"
            head_branch="domain-request/$slug-${app_id:0:8}"
            pr="$(gh pr list --state merged --base main --head "$head_branch" --json number --jq '.[0].number')"
            [ -n "$pr" ] || { echo "No merged PR found for $slug"; exit 1; }
            curl -fsS "$API_URL" -H "Content-Type: application/json" -d "$(jq -n --arg slug "$slug" --argjson prNumber "$pr" '{action:"sync_domain_approval",slug:$slug,prNumber:$prNumber}')"
          done <<< "$files"
