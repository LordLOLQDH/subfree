name: SubFree domain request review
on:
  pull_request:
    branches: [main]
    paths:
      - "domain-requests/*.json"
  push:
    branches: [main]
    paths:
      - "domain-requests/*.json"
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  validate-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate compact public request summary
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          changes="$(git diff --name-status "origin/$BASE_REF...HEAD" -- 'domain-requests/*.json')"
          test -n "$changes" || { echo "No domain request JSON found"; exit 1; }
          invalid="$(printf '%s\n' "$changes" | awk '$1 != "A" { print }')"
          test -z "$invalid" || { echo "Only new request files may be added; existing request files cannot be edited or replaced."; printf '%s\n' "$invalid"; exit 1; }
          files="$(printf '%s\n' "$changes" | awk '$1 == "A" { print $2 }')"
          test -n "$files" || { echo "No new domain request JSON found"; exit 1; }
          while IFS= read -r file; do
            node - "$file" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const slug = file.split('/').pop().replace(/\.json$/, '');
          if (data.schemaVersion !== 2) throw new Error('Unsupported schemaVersion');
          if (data.slug !== slug || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) throw new Error('Invalid slug');
          if (typeof data.applicantName !== 'string' || !data.applicantName.trim()) throw new Error('Applicant name is missing');
          const url = new URL(data.websiteUrl);
          if (url.protocol !== 'https:' || url.username || url.password || url.port) throw new Error('Website URL must be public HTTPS on the default port');
          if (typeof data.purpose !== 'string' || data.purpose.trim().length < 30 || data.purpose.length > 1600) throw new Error('Purpose is missing or outside allowed length');
          for (const forbidden of ['applicantEmail','accessKey','requestIp','request_ip_hash','check_results','aiReview']) {
            if (Object.hasOwn(data, forbidden)) throw new Error('Private or internal field found in public PR: ' + forbidden);
          }
          console.log('Validated compact public application summary: ' + file);
          NODE
          done <<< "$files"
      - name: Post formal validation result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          files="$(git diff --name-only "origin/$BASE_REF...HEAD" | grep '^domain-requests/[^/]*\.json$' || true)"
          count="$(printf '%s\n' "$files" | grep -c . || true)"
          gh pr comment "$PR_NUMBER" --body "## SubFree: Formale Dateiprüfung abgeschlossen

          - JSON-Struktur und Pflichtfelder gültig
          - Pfadname und HTTPS-Ziel formal gültig
          - Nur die kurze öffentliche Antragsübersicht ist enthalten
          - Private Kontakt- und Zugangsdaten sind ausgeschlossen

          **Wichtig:** Dies ist ausdrücklich KEINE Inhaltsfreigabe. KI- und technische Prüfergebnisse werden separat als PR-Kommentar veröffentlicht. Kein automatischer Merge."
  sync-approved-request:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize manually merged requests
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: https://eopvkwhcgznvubesaszv.supabase.co/functions/v1/subfree-api
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch origin main
          files="$(git diff --name-only "$BEFORE_SHA" "${GITHUB_SHA}" | grep '^domain-requests/[^/]*\.json$' || true)"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            slug="$(basename "$file" .json)"
            pr="$(gh pr list --state merged --base main --limit 100 --json number,title --jq '.[] | select(.title == "Domain-Antrag: /'"$slug"'") | .number' | head -n 1)"
            [ -n "$pr" ] || { echo "No merged PR found for $slug"; exit 1; }
            curl -fsS "$API_URL" -H "Content-Type: application/json" -d "$(jq -n --arg slug "$slug" --argjson prNumber "$pr" '{action:"sync_domain_approval",slug:$slug,prNumber:$prNumber}')"
          done <<< "$files"
