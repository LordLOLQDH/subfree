name: Register Redirect

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: subfree-redirect-database
  cancel-in-progress: false

jobs:
  register:
    if: startsWith(github.event.issue.title, 'DOMAIN_REG: ')
    runs-on: ubuntu-latest

    steps:
      - name: Validate request and update redirects.json
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;

            async function reply(body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body
              });
            }

            try {
              const match = issue.title.match(/^DOMAIN_REG: ([a-z0-9-]{3,30})$/i);
              if (!match) throw new Error("Der Issue-Titel hat ein ungültiges Format.");

              const slug = match[1].toLowerCase();
              const nameLine = issue.body.match(/^Wunschname:\s*([a-z0-9-]{3,30})\s*$/im);
              const targetLine = issue.body.match(/^Ziel-URL:\s*(https:\/\/\S+)\s*$/im);

              if (!nameLine || !targetLine) {
                throw new Error("Wunschname oder HTTPS-Ziel-URL fehlt.");
              }

              if (nameLine[1].toLowerCase() !== slug) {
                throw new Error("Wunschname im Titel und im Formular stimmen nicht überein.");
              }

              const reserved = [
                "admin", "api", "assets", "contact", "index",
                "login", "register", "registrieren", "rules"
              ];

              if (reserved.includes(slug)) {
                throw new Error("Dieser Name ist reserviert.");
              }

              const target = new URL(targetLine[1]);
              if (target.protocol !== "https:" || target.username || target.password) {
                throw new Error("Nur gültige HTTPS-Ziele ohne Zugangsdaten sind erlaubt.");
              }

              const path = "redirects.json";
              const branch = context.payload.repository.default_branch;
              let redirects = {};
              let sha;

              try {
                const response = await github.rest.repos.getContent({
                  owner, repo, path, ref: branch
                });

                if (Array.isArray(response.data) || !response.data.content) {
                  throw new Error("redirects.json konnte nicht gelesen werden.");
                }

                sha = response.data.sha;
                redirects = JSON.parse(
                  Buffer.from(response.data.content, "base64").toString("utf8")
                );
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              if (!redirects || typeof redirects !== "object" || Array.isArray(redirects)) {
                throw new Error("redirects.json enthält keine gültige JSON-Objektstruktur.");
              }

              if (Object.prototype.hasOwnProperty.call(redirects, slug)) {
                throw new Error("Dieser Wunschname ist bereits vergeben.");
              }

              redirects[slug] = target.toString();

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch,
                message: "Register redirect: " + slug,
                content: Buffer.from(JSON.stringify(redirects, null, 2) + "\n").toString("base64"),
                ...(sha ? { sha } : {})
              });

              await reply(
                "Die Registrierung wurde automatisch geprüft und in `redirects.json` gespeichert. " +
                "Vercel erstellt jetzt ein neues Deployment. Die Weiterleitung wird nach erfolgreicher " +
                "Bereitstellung aktiv."
              );
            } catch (error) {
              await reply("Registrierung fehlgeschlagen: " + error.message);
              core.setFailed(error.message);
            }
