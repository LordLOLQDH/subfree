<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>weiterleiten</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--sf-green:#00ff88;--sf-bg:#030604;--sf-panel:#07110b;--sf-border:#1d4930;--sf-muted:#9db5a4;--sf-text:#e8f5ec}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;font-family:"VT323","SFMono-Regular",Consolas,monospace}
body{display:flex;flex-direction:column;background:#000;color:var(--sf-text)}
#status{padding:24px;color:var(--sf-muted);font-size:18px}
iframe{display:block;flex:1 0 auto;width:100%;height:100vh;min-height:100vh;border:0;background:#fff}
.subfree-ad{position:relative;isolation:isolate;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 24px;width:100%;max-width:100%;padding:17px clamp(14px,3vw,34px);overflow:hidden;background-color:var(--sf-bg);background-image:linear-gradient(rgba(0,255,136,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.045) 1px,transparent 1px);background-size:16px 16px;border-top:2px solid var(--sf-green);box-shadow:0 -4px 18px rgba(0,255,136,.08);color:var(--sf-muted);font:16px/1.45 "VT323","SFMono-Regular",Consolas,monospace;text-align:left}
.subfree-ad:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(0,255,136,.07),transparent 55%)}
.subfree-ad-copy{min-width:0}
.subfree-ad-kicker{display:flex;align-items:center;gap:8px;margin:0 0 5px;color:var(--sf-green);font:8px/1.8 "Press Start 2P","VT323",monospace;letter-spacing:.2px}
.subfree-ad-kicker:before{content:"";width:7px;height:7px;flex:0 0 7px;background:var(--sf-green);box-shadow:0 0 9px var(--sf-green)}
.subfree-ad strong{display:block;margin:0 0 3px;color:var(--sf-text);font:clamp(13px,1.4vw,16px)/1.7 "Press Start 2P","VT323",monospace}
.subfree-ad p{margin:0;color:var(--sf-muted);font:17px/1.35 "VT323","SFMono-Regular",Consolas,monospace}
.subfree-ad a{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:42px;max-width:100%;padding:10px 15px;border:1px solid var(--sf-green);background:#06170d;color:var(--sf-green);font:9px/1.7 "Press Start 2P","VT323",monospace;text-align:center;text-decoration:none;box-shadow:3px 3px 0 #092013;transition:transform .15s ease,background .15s ease,box-shadow .15s ease}
.subfree-ad a:after{content:"↗";font:17px/1 "VT323",monospace}
.subfree-ad a:hover,.subfree-ad a:focus-visible{background:#0b2a17;color:#dffff0;transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--sf-green);outline:2px solid transparent}
@media(max-width:640px){.subfree-ad{grid-template-columns:minmax(0,1fr);gap:12px;padding:15px 14px}.subfree-ad strong{font-size:12px}.subfree-ad p{font-size:16px}.subfree-ad a{justify-self:start;width:auto;min-height:40px;font-size:8px}}
@media(prefers-reduced-motion:reduce){.subfree-ad a{transition:none}}

.redirect-mode{min-height:100vh;display:grid;place-items:center;padding:24px;background-color:#050805;background-image:linear-gradient(rgba(0,255,102,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,102,.055) 1px,transparent 1px);background-size:16px 16px}
.redirect-shell{width:100%;max-width:720px}.redirect-header,.redirect-footer{display:flex;align-items:center;justify-content:space-between;gap:14px}
.redirect-brand{font:16px/1.6 "Press Start 2P",monospace;color:#fff}.redirect-brand span{color:#00ff66}.redirect-online{color:#00ff66;font-size:17px}
.redirect-panel{margin-top:25px;padding:clamp(20px,5vw,34px);background:rgba(8,14,9,.96);border:2px solid #24512e;box-shadow:6px 6px 0 #102b19}
.redirect-kicker{color:#00ff66;font:9px/2 "Press Start 2P",monospace}.redirect-title{margin:26px 0 12px;color:#fff;font:clamp(20px,4vw,30px)/1.6 "Press Start 2P",monospace}
.redirect-description{margin:0;color:#a8bca9;font-size:22px;line-height:1.35}.redirect-separator{height:2px;margin:25px 0;background:#24512e}
.redirect-status{color:#00ff66;font-size:21px}.redirect-progress-top{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;color:#00ff66}
.redirect-percent{font-size:34px}.redirect-bar{overflow-wrap:anywhere;color:#00ff66;font-size:clamp(16px,3.5vw,24px);letter-spacing:2px;line-height:1.5}
.redirect-log{min-height:95px;margin-top:20px;color:#8ba58e;font-size:18px;line-height:1.45}
.redirect-button{display:block;width:100%;margin-top:22px;padding:15px;border:2px solid #00ff66;background:#00ff66;color:#050805;text-align:center;text-decoration:none;font:9px/1.8 "Press Start 2P",monospace;cursor:pointer;box-shadow:4px 4px 0 #173d25}
.redirect-button:hover{background:#c5ffd8}.redirect-button[hidden]{display:none}.redirect-footer{margin-top:20px;color:#6e8a73;font-size:16px}
.redirect-error{color:#ff6666!important}.redirect-error-border{border-color:#743333!important;box-shadow:6px 6px 0 #351616}
@media(max-width:520px){.redirect-mode{padding:16px}.redirect-panel{padding:20px}.redirect-brand{font-size:12px}.redirect-kicker{font-size:8px}.redirect-footer{font-size:14px}}

</style></head>
<body><div id="status" role="status">Website wird geladen …</div><script>

(async()=>{
const slug="weiterleiten",api="https://eopvkwhcgznvubesaszv.supabase.co/functions/v1/subfree-api";
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
try{
const r=await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"public_site",slug})});
const d=await r.json();if(!r.ok)throw new Error(d.error||"Website nicht verfügbar");
if(d.siteType==="redirect"){await renderRedirect(d.redirectUrl,d.username||slug);return;}
let content=d.html||"<h1>Diese Website ist noch leer.</h1>";
const base="<base href=\""+location.pathname.replace(/[^/]*$/,"")+"\">";
if(/<head[^>]*>/i.test(content))content=content.replace(/<head[^>]*>/i,m=>m+base);else content="<!doctype html><head>"+base+"</head>"+content;
const frame=document.createElement("iframe");frame.setAttribute("sandbox","allow-scripts allow-forms allow-popups");frame.title="SubFree-Projekt "+slug;frame.srcdoc=content;
const badge=document.createElement("footer");badge.className="subfree-ad";badge.setAttribute("aria-label","Hinweis auf SubFree");
badge.innerHTML='<div class="subfree-ad-copy"><div class="subfree-ad-kicker">HOSTED ON SUBFREE</div><strong>Diese Website läuft mit SubFree.</strong><p>Erstelle deine eigene Website. Kostenlos und unkompliziert.</p></div><a href="https://lordlolqdh.github.io/subfree/" target="_top" rel="noopener">Eigene Website starten</a>';
document.body.replaceChildren(frame,badge);
}catch(e){document.getElementById("status").textContent="Diese Website ist derzeit nicht verfügbar: "+e.message;}
async function renderRedirect(target,username){
const shell=el("main","redirect-shell"),header=el("header","redirect-header"),brand=el("div","redirect-brand");
brand.innerHTML='SUBFREE<span>.</span>';header.append(brand,el("div","redirect-online","● SYSTEM ONLINE"));
const panel=el("section","redirect-panel");panel.append(el("div","redirect-kicker","▶ SUBFREE_NET.EXE // NETWORK DIAGNOSTIC"));
panel.append(el("h1","redirect-title","REDIRECT.EXE"),el("p","redirect-description","Dein Ziel wird geprüft. Die Verbindung wird vorbereitet."),el("div","redirect-separator"));
const status=el("div","redirect-status","[ STATUS ] INITIALIZING"),top=el("div","redirect-progress-top");
const percent=el("strong","redirect-percent","0%"),timer=el("span","","0.0s");top.append(percent,timer);
const bar=el("div","redirect-bar","--------------------"),log=el("div","redirect-log","> SubFree system started");
const button=el("a","redirect-button","[ OPEN DESTINATION ]");button.href=target;button.hidden=true;
panel.append(status,top,bar,log,button);
const footer=el("footer","redirect-footer");footer.append(el("span","","SUBFREE OS // 32-BIT"),el("span","","@"+username));
shell.append(header,panel,footer);document.body.className="redirect-mode";document.body.replaceChildren(shell);
async function runTest(){
button.hidden=true;panel.classList.remove("redirect-error-border");status.classList.remove("redirect-error");
status.textContent="[ STATUS ] RUNNING DIAGNOSTIC";log.textContent="> Resolving DNS...";percent.textContent="0%";bar.textContent="--------------------";
const started=performance.now();let done=false;let progress=0;
function animate(){if(done)return;const elapsed=performance.now()-started;progress=Math.min(88,Math.floor(elapsed/55));
percent.textContent=progress+"%";const filled=Math.floor(progress/100*20);bar.textContent="#".repeat(filled)+"-".repeat(20-filled);timer.textContent=(elapsed/1000).toFixed(1)+"s";
if(progress<30){status.textContent="[ STATUS ] DNS LOOKUP";log.textContent="> Resolving public DNS records...";}
else if(progress<65){status.textContent="[ STATUS ] CONNECTING";log.textContent="> Opening HTTPS connection...";}
else{status.textContent="[ STATUS ] WAITING FOR RESPONSE";log.textContent="> Waiting for server response...";}
requestAnimationFrame(animate);}
requestAnimationFrame(animate);
const minimumWait=new Promise(resolve=>setTimeout(resolve,2000));let result;
try{const check=await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"diagnostic",slug})});
result=await check.json();if(!check.ok)throw new Error(result.error||"Diagnostic request failed");}
catch(error){result={reachable:false,ok:false,error:error.message,dnsStatus:"unknown"};}
await minimumWait;done=true;percent.textContent="100%";bar.textContent="#".repeat(20);timer.textContent=((performance.now()-started)/1000).toFixed(1)+"s";
if(result.reachable){status.textContent=result.ok?"[ STATUS ] TARGET ONLINE":"[ STATUS ] SERVER RESPONSE // HTTP ERROR";
log.textContent="> DNS: "+result.dnsStatus+" | HTTP: "+result.httpStatus+" | RTT: "+result.responseTimeMs+" ms";
button.hidden=false;button.textContent=result.ok?"[ OPEN DESTINATION ]":"[ OPEN ANYWAY ]";
if(result.ok){log.textContent+=" | CONNECTION SUCCESSFUL";setTimeout(()=>window.location.assign(target),450);}
else{status.classList.add("redirect-error");log.textContent+=" | Server antwortet, meldet aber einen HTTP-Fehler. Manuelle Öffnung möglich.";}}
else{status.textContent="[ STATUS ] TARGET UNREACHABLE";status.classList.add("redirect-error");panel.classList.add("redirect-error-border");
log.textContent="> DNS: "+(result.dnsStatus||"UNKNOWN")+" | ERROR: "+(result.error||"No response");
const retry=el("button","redirect-button","[ RETRY DIAGNOSTIC ]");retry.type="button";retry.addEventListener("click",runTest);panel.append(retry);}
}
runTest();
}
})();

</script></body></html>
